<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>notbad-dispatch</title>
<style>
:root {
    --panel: rgba(16, 20, 27, .93);
    --line: rgba(255, 255, 255, .1);
    --text: #eef1f5;
    --muted: #8d95a3;
    --bad: #ff5a4f;
    --ok: #37d67a;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }

/* sizes are in em and the card scales with the screen height (16px on 1080p) */
#call {
    position: fixed;
    top: 24vh;
    right: 1.6vw;
    width: 21em;
    font: 1.48vh/1.3 Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: .28em solid var(--bad);
    border-radius: .4em;
    box-shadow: 0 1.2em 2.8em rgba(0, 0, 0, .5);
    opacity: 0;
    transform: translateX(calc(100% + 3vw));
    transition: transform .4s cubic-bezier(.2, .8, .2, 1), opacity .4s, border-color .3s;
}
#call.show { opacity: 1; transform: none; }
#call.scene { border-left-color: var(--ok); }
#call.offer { border-left-color: #ffb020; }
#call.offer #call-tag { color: #ffb020; }
#call.offer #call-state::before { background: #ffb020; }
#call.closed { border-left-color: var(--muted); }

#call header { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: .85em 1.05em 0; }
#call-tag { color: var(--bad); font-size: .78em; font-weight: 600; letter-spacing: .15em; text-transform: uppercase; }
#call.scene #call-tag { color: var(--ok); }
#call.closed #call-tag { color: var(--muted); }
#call-code { padding: .15em .5em .05em; border-radius: .22em; background: rgba(255, 255, 255, .11); font-size: .85em; font-variant-numeric: tabular-nums; }
#call-title { margin: .3em .8em 0; font-size: 1.36em; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
#call-text { margin: .3em 1.15em 0; color: var(--muted); font-size: .93em; line-height: 1.4; overflow-wrap: anywhere; }

#call-units { margin: .65em 1.2em 0; font-size: .88em; line-height: 1.4; }
#call-units b { display: block; font-weight: 600; }
#call-units span { display: block; color: var(--muted); overflow-wrap: anywhere; }
#call-row { display: flex; align-items: center; justify-content: space-between; margin-top: .85em; padding: .65em 1.05em .6em; border-top: 1px solid var(--line); }
#call-state { display: flex; align-items: center; gap: .6em; font-size: .8em; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; }
#call-state::before { content: ""; width: .65em; height: .65em; border-radius: 50%; background: var(--bad); animation: blink 1.1s ease-in-out infinite; }
#call.scene #call-state::before { background: var(--ok); animation: none; }
#call.closed #call-state::before { background: var(--muted); animation: none; }
@keyframes blink { 50% { opacity: .25; } }
#call-dist { font-size: 1.3em; font-weight: 600; font-variant-numeric: tabular-nums; }
#call-hint { padding: 0 1.3em .8em; color: var(--muted); font-size: .8em; }
#call-hint kbd { padding: .1em .45em 0; border: 1px solid var(--line); border-radius: .25em; font: inherit; color: var(--text); }
#call header .chips { display: flex; gap: .4em; }
#call-prio { padding: .15em .5em .05em; border-radius: .22em; font-size: .85em; font-weight: 600; background: var(--bad); color: #fff; }
#call-prio.p2 { background: #ffb020; color: #10141b; }
#call-prio.p3 { background: rgba(255, 255, 255, .16); color: var(--text); }
#call.browse { border-left-color: #35c7ff; }
#call.browse #call-tag { color: #35c7ff; }
#call.browse #call-state::before { background: #35c7ff; animation: none; }
#call-hint { line-height: 1.9; }
#call.panic { border-left-color: var(--bad); }
#call.panic #call-tag { color: var(--bad); }
#call.panic #call-state::before { background: var(--bad); }

/* short message, bottom right: status changes and the like */
#toast {
    position: fixed;
    right: 1.6vw;
    bottom: 22vh;
    padding: .7em 1.1em .6em;
    font: 1.48vh/1.3 Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: .28em solid var(--ok);
    border-radius: .4em;
    opacity: 0;
    transform: translateY(1em);
    transition: opacity .25s, transform .25s;
}
#toast.show { opacity: 1; transform: none; }

/* /calls: the open calls, opened with the mouse cursor */
#list {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 34em;
    max-height: 70vh;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    font: 1.48vh/1.3 Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: .5em;
    box-shadow: 0 1.4em 3.4em rgba(0, 0, 0, .6);
}
#list header { display: flex; align-items: baseline; justify-content: space-between; padding: 1em 1.2em .8em; border-bottom: 1px solid var(--line); }
#list h1 { margin: 0; font-size: 1.3em; font-weight: 600; }
#list-close { color: var(--muted); font-size: .85em; }
#list-rows { margin: 0; padding: .4em; list-style: none; overflow-y: auto; }
#list-rows li { display: flex; align-items: center; gap: .8em; padding: .65em .8em; border-radius: .3em; }
#list-rows li + li { border-top: 1px solid var(--line); }
#list-rows .prio { flex: none; width: 2.2em; padding: .15em 0 .05em; border-radius: .22em; text-align: center; font-size: .82em; font-weight: 600; background: var(--bad); color: #fff; }
#list-rows .prio.p2 { background: #ffb020; color: #10141b; }
#list-rows .prio.p3 { background: rgba(255, 255, 255, .16); color: var(--text); }
#list-rows .main { flex: 1; min-width: 0; }
#list-rows .title { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list-rows .sub { display: block; margin-top: .1em; color: var(--muted); font-size: .88em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#list-rows .dist { flex: none; font-variant-numeric: tabular-nums; }
#list-rows button { flex: none; padding: .5em 1em .4em; border: 0; border-radius: .3em; background: var(--ok); color: #0c1a12; font: inherit; font-weight: 600; cursor: pointer; }
#list-rows .note { flex: none; color: var(--muted); font-size: .85em; }
#list-rows .empty { justify-content: center; color: var(--muted); padding: 1.6em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<aside id="call">
    <header>
        <span id="call-tag">Dispatch</span>
        <span class="chips"><span id="call-prio" hidden></span><span id="call-code" hidden></span></span>
    </header>
    <div id="call-title"></div>
    <div id="call-text"></div>
    <div id="call-units" hidden><b></b><span></span></div>
    <div id="call-row">
        <span id="call-state"></span>
        <span id="call-dist"></span>
    </div>
    <div id="call-hint"></div>
</aside>

<div id="toast"></div>

<section id="list" hidden>
    <header>
        <h1 id="list-title"></h1>
        <span id="list-close"></span>
    </header>
    <ul id="list-rows"></ul>
</section>

<script>
// In-game page of notbad-dispatch. Radio: plays audio that comes from the web map and
// records the microphone while the player is transmitting on a radio channel that
// the web map is listening to. Dispatch: shows the card for the player's call.
(() => {
    const RATE = 12000;      // samples per second on the wire
    const CHUNK = 1200;      // samples per packet (100 ms)

    // ---- G.711 mu-law, one byte per sample ----
    function muEncode(s) {
        s = Math.max(-1, Math.min(1, s));
        const sign = s < 0 ? 0x80 : 0;
        const v = Math.min(32635, Math.round(Math.abs(s) * 32767)) + 132;
        let exp = 7;
        for (let mask = 0x4000; (v & mask) === 0 && exp > 0; mask >>= 1) exp--;
        return ~(sign | (exp << 4) | ((v >> (exp + 3)) & 0x0f)) & 0xff;
    }
    function muDecode(b) {
        b = ~b & 0xff;
        const v = ((((b & 0x0f) << 3) + 132) << ((b >> 4) & 7)) - 132;
        return (b & 0x80 ? -v : v) / 32768;
    }

    // averages the microphone down to RATE and hands out mu-law packets
    function downsampler(inRate, onChunk) {
        const step = inRate / RATE;
        let pos = 0, sum = 0, n = 0, out = new Uint8Array(CHUNK), fill = 0;
        return {
            push(input) {
                for (let i = 0; i < input.length; i++) {
                    sum += input[i]; n++; pos++;
                    if (pos >= step) {
                        pos -= step;
                        out[fill++] = muEncode(sum / n);
                        sum = 0; n = 0;
                        if (fill === CHUNK) { onChunk(out); out = new Uint8Array(CHUNK); fill = 0; }
                    }
                }
            },
            flush() {
                if (fill > 0) onChunk(out.slice(0, fill));
                out = new Uint8Array(CHUNK); fill = 0; pos = 0; sum = 0; n = 0;
            },
        };
    }

    // radio sound: narrow band, a little grit, static while somebody talks, squelch clicks
    function radioSound(ctx, dest) {
        const noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
        const samples = noise.getChannelData(0);
        for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;

        const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 620;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
        const mid = ctx.createBiquadFilter(); mid.type = 'peaking'; mid.frequency.value = 1500; mid.Q.value = 1.4; mid.gain.value = 10;
        const drive = ctx.createWaveShaper();
        const curve = new Float32Array(1024);
        for (let i = 0; i < curve.length; i++) {
            const x = i / (curve.length - 1) * 2 - 1;
            curve[i] = Math.tanh(4 * x) / Math.tanh(4);
        }
        drive.curve = curve;
        // boost before the soft clipper: quiet voices come up, loud ones are held at the ceiling
        const boost = ctx.createGain(); boost.gain.value = 3.2;
        const level = ctx.createGain(); level.gain.value = 0.5;
        // each filter twice for steep edges, then hard compression, then the small-speaker roll-off
        const hp2 = ctx.createBiquadFilter(); hp2.type = 'highpass'; hp2.frequency.value = 620;
        const lp2 = ctx.createBiquadFilter(); lp2.type = 'lowpass'; lp2.frequency.value = 2600;
        const speaker = ctx.createBiquadFilter(); speaker.type = 'lowpass'; speaker.frequency.value = 3000;
        hp.connect(hp2); hp2.connect(lp); lp.connect(lp2); lp2.connect(mid); mid.connect(boost);
        boost.connect(drive); drive.connect(speaker); speaker.connect(level); level.connect(dest);

        const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 2200; band.Q.value = 0.7;
        band.connect(dest);

        let hiss = null, until = 0, timer = null;

        function burst(at, length, volume) {
            const src = ctx.createBufferSource(), gain = ctx.createGain();
            src.buffer = noise;
            gain.gain.setValueAtTime(volume, at);
            gain.gain.exponentialRampToValueAtTime(0.001, at + length);
            src.connect(gain); gain.connect(band);
            src.start(at, Math.random() * 0.5);
            src.stop(at + length);
        }

        function finish() {
            if (ctx.currentTime < until + 0.2) { timer = setTimeout(finish, 60); return; }
            hiss.stop();
            hiss = null;
            burst(ctx.currentTime, 0.12, 0.12);          // squelch tail when the transmission ends
        }

        return {
            input: hp,
            // call for every packet with the times it starts and ends
            packet(start, end) {
                if (!hiss) {
                    const gain = ctx.createGain();
                    gain.gain.value = 0.007;
                    hiss = ctx.createBufferSource();
                    hiss.buffer = noise; hiss.loop = true;
                    hiss.connect(gain); gain.connect(band);
                    hiss.start(start);
                    burst(start, 0.04, 0.1);             // click when somebody keys up
                    until = 0;
                }
                until = Math.max(until, end);
                clearTimeout(timer);
                timer = setTimeout(finish, Math.max(0, (until - ctx.currentTime) * 1000) + 200);
            },
        };
    }

    let ctx = null, master = null, fx = null;
    const next = {};         // sender -> time the next packet should start

    function audio() {
        if (!ctx) {
            ctx = new (window.AudioContext || window.webkitAudioContext)();
            master = ctx.createGain();
            master.connect(ctx.destination);
            fx = radioSound(ctx, master);
        }
        if (ctx.state === 'suspended') ctx.resume();
        return ctx;
    }

    function play(msg) {
        if (typeof msg.d !== 'string') return;
        const c = audio();
        const bin = atob(msg.d);
        if (!bin.length) return;
        const buf = c.createBuffer(1, bin.length, RATE), data = buf.getChannelData(0);
        for (let i = 0; i < bin.length; i++) data[i] = muDecode(bin.charCodeAt(i));

        master.gain.value = typeof msg.v === 'number' ? Math.max(0, Math.min(1, msg.v)) : 0.6;
        const effect = msg.e !== false;
        const src = c.createBufferSource();
        src.buffer = buf;
        src.connect(effect ? fx.input : master);
        const from = msg.f || 'web';
        let at = next[from] || 0;
        if (at < c.currentTime + 0.02) at = c.currentTime + 0.15;   // small buffer against stutter
        src.start(at);
        next[from] = at + buf.duration;
        if (effect) fx.packet(at, at + buf.duration);
    }

    // ---- microphone ----
    let mic = null, want = false, active = false, opening = null, failed = false;

    function send(bytes) {
        fetch(`https://${GetParentResourceName()}/mic`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ d: btoa(String.fromCharCode.apply(null, bytes)) }),
        }).catch(() => {});
    }

    // Hands microphone blocks to onBlock while active(true). Uses an AudioWorklet where the
    // browser allows it and falls back to the older ScriptProcessor otherwise.
    async function micTap(ctx, source, onBlock) {
        const mute = ctx.createGain();
        mute.gain.value = 0;
        mute.connect(ctx.destination);

        if (ctx.audioWorklet && window.AudioWorkletNode) {
            try {
                if (!ctx.micTapLoaded) {
                    const code = 'registerProcessor("mic-tap", class extends AudioWorkletProcessor {'
                        + ' constructor() { super(); this.on = false; this.port.onmessage = (e) => { this.on = !!e.data; }; }'
                        + ' process(inputs) { const ch = inputs[0][0]; if (this.on && ch) this.port.postMessage(ch.slice(0)); return true; } });';
                    const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
                    await ctx.audioWorklet.addModule(url);
                    URL.revokeObjectURL(url);
                    ctx.micTapLoaded = true;
                }
                const node = new AudioWorkletNode(ctx, 'mic-tap');
                node.port.onmessage = (e) => onBlock(e.data);
                source.connect(node);
                node.connect(mute);
                return {
                    kind: 'worklet',
                    active(on) { node.port.postMessage(on); },
                    stop() { node.port.onmessage = null; node.disconnect(); mute.disconnect(); },
                };
            } catch (e) { /* not available here: use the fallback below */ }
        }

        let on = false;
        const node = ctx.createScriptProcessor(1024, 1, 1);
        node.onaudioprocess = (e) => { if (on) onBlock(e.inputBuffer.getChannelData(0)); };
        source.connect(node);
        node.connect(mute);
        return {
            kind: 'script',
            active(value) { on = value; },
            stop() { node.onaudioprocess = null; node.disconnect(); mute.disconnect(); },
        };
    }

    function openMic() {
        if (mic) return Promise.resolve(true);
        if (failed) return Promise.resolve(false);
        if (!opening) {
            opening = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
                .then(async (stream) => {
                    const c = audio();
                    const source = c.createMediaStreamSource(stream);
                    const down = downsampler(c.sampleRate, send);
                    const tap = await micTap(c, source, (block) => { if (active) down.push(block); });
                    mic = { down, tap };
                    return true;
                })
                .catch((err) => {
                    failed = true;
                    console.log('[notbad-dispatch] microphone not available for the web radio: ' + err);
                    return false;
                });
        }
        return opening;
    }

    function capture(on) {
        want = on;
        if (!on) {
            if (active) { active = false; mic.tap.active(false); mic.down.flush(); }
            return;
        }
        openMic().then((ok) => { if (ok && want) { active = true; mic.tap.active(true); } });
    }

    // ---- texts: English until client.lua sends the server's language with a message (msg.t) ----
    let T = {
        dispatch: 'Dispatch', default_call: 'Call', new_call: 'New call', panic: 'PANIC', priority: 'Priority',
        en_route: 'En route', on_scene: 'On scene', new_location: 'New location', call_closed: 'Call closed',
        waiting_unit: 'Waiting for a unit', units_one: '1 unit responding', units_many: '%d units responding',
        n_on_scene: '%d on scene', hint_clear: 'or /callclear when you are done', hint_take: 'or /callaccept to take this call',
        calls_title: 'Open calls', calls_none: 'No open calls', calls_take: 'Take', calls_mine: 'Your call',
        calls_dispatch_only: 'Dispatch assigns the units', calls_close: 'Esc to close', units_short: 'units',
        hint_browse: 'to browse the calls', hint_go: 'to take this call', browse_title: 'Call %d of %d',
    };
    const el = (id) => document.getElementById(id);
    const fill = (text, n) => String(text).replace('%d', n);
    const far = (meters) => (meters >= 1000 ? (meters / 1000).toFixed(1) + ' km' : Math.round(meters / 10) * 10 + ' m');
    const post = (name, data) => fetch(`https://${GetParentResourceName()}/${name}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}),
    }).catch(() => {});

    // ---- dispatch card: the call this player is sent to, or one that is offered ----
    const card = el('call');
    let hideTimer = null, sign = null;
    // the call this player is on, remembered so the card can come back after flipping through other calls
    const mine = { call: null, units: null, meters: null, scene: false };

    function hint(key, text) {
        const box = el('call-hint');
        box.textContent = '';
        const kbd = document.createElement('kbd');
        kbd.textContent = key;
        box.append(kbd, ' ' + text);
    }

    // title, details, code and priority: the same for a call, an offer and an edit
    function fillCall(call) {
        const prio = call.priority || 2;
        el('call-prio').textContent = 'P' + prio;
        el('call-prio').className = 'p' + prio;
        el('call-prio').hidden = false;
        el('call-code').textContent = call.code || '';
        el('call-code').hidden = !call.code;
        el('call-title').textContent = call.title || T.default_call;
        el('call-text').textContent = call.text || '';
        el('call-text').hidden = !call.text;
    }

    function showSign(callsign) {
        sign = callsign || null;
        if (mine.call) mine.call.callsign = sign;
        if (onCall()) el('call-tag').textContent = sign ? `${T.dispatch} · ${sign}` : T.dispatch;
    }

    // one of the open calls, reached with the arrow keys; G takes it
    function showBrowse(call, index, total) {
        clearTimeout(hideTimer);
        card.className = 'show browse' + (call.panic ? ' panic' : '');
        el('call-tag').textContent = fill(fill(T.browse_title, index), total);
        fillCall(call);
        el('call-units').hidden = false;
        el('call-units').querySelector('b').textContent = `${call.units || 0} ${T.units_short}`;
        el('call-units').querySelector('span').textContent = '';
        el('call-state').textContent = call.mine ? T.calls_mine : (call.take ? T.waiting_unit : T.calls_dispatch_only);
        el('call-dist').textContent = far(call.m || 0);
        const box = el('call-hint');
        box.textContent = '';
        const arrows = document.createElement('kbd');
        arrows.textContent = '← →';
        box.append(arrows, ' ' + T.hint_browse);
        if (call.take && !call.mine) {
            const go = document.createElement('kbd');
            go.textContent = 'G';
            box.append(document.createElement('br'), go, ' ' + T.hint_go);
        }
        box.hidden = false;
    }

    // back to the player's own call, or away
    function endBrowse() {
        if (!card.classList.contains('browse')) return;
        if (!mine.call) { card.className = ''; return; }
        showCall(mine.call);
        if (mine.units) showUnits(mine.units);
        if (mine.meters !== null) showDistance(mine.meters, mine.scene);
    }

    // a call nobody was sent to yet: F10 takes it
    function showOffer(call, meters) {
        clearTimeout(hideTimer);
        card.className = 'show offer' + (call.panic ? ' panic' : '');
        el('call-tag').textContent = call.panic ? T.panic : T.new_call;
        fillCall(call);
        el('call-units').hidden = true;
        el('call-state').textContent = T.waiting_unit;
        el('call-dist').textContent = far(meters);
        hint('F10', T.hint_take);
        el('call-hint').hidden = false;
    }

    function endOffer() {
        if (card.classList.contains('offer')) card.className = '';
    }

    function showCall(call) {
        clearTimeout(hideTimer);
        if (mine.call !== call) { mine.call = call; mine.units = null; mine.meters = null; mine.scene = false; }
        card.className = 'show' + (call.panic ? ' panic' : '');
        showSign(call.callsign);
        fillCall(call);
        el('call-units').hidden = true;
        el('call-state').textContent = T.en_route;
        el('call-dist').textContent = '';
        hint('F9', T.hint_clear);
        el('call-hint').hidden = call.canClear === false;
    }

    const onCall = () => card.classList.contains('show') && !['closed', 'offer', 'browse'].some((name) => card.classList.contains(name));

    // the dispatcher edited the call: new details, and after a move the unit is en route again
    function updateCall(call, moved) {
        if (mine.call) mine.call = Object.assign({}, mine.call, call);
        if (!onCall()) return;
        fillCall(call);
        if (moved) {
            card.classList.remove('scene');
            el('call-state').textContent = T.new_location;
        }
    }

    // how many units are on this call and which ones
    function showUnits(info) {
        if (mine.call) mine.units = info;
        if (!onCall()) return;
        const total = info.total || 0, scene = info.scene || 0;
        const names = Array.isArray(info.units) ? info.units : [];
        const box = el('call-units');
        box.hidden = total === 0;
        box.querySelector('b').textContent = (total === 1 ? T.units_one : fill(T.units_many, total))
            + (scene ? ' · ' + fill(T.n_on_scene, scene) : '');
        box.querySelector('span').textContent = names.join(', ');
    }

    function showDistance(meters, scene) {
        if (mine.call) { mine.meters = meters; mine.scene = !!scene; }
        if (!onCall()) return;
        el('call-dist').textContent = far(meters);
        if (scene || el('call-state').textContent !== T.new_location) {
            el('call-state').textContent = scene ? T.on_scene : T.en_route;
        }
        card.classList.toggle('scene', !!scene);
    }

    function closeCall() {
        mine.call = null;
        if (card.classList.contains('browse')) return;      // flipping through calls: nothing to close on screen
        if (!onCall()) return;
        card.classList.remove('scene');
        card.classList.add('closed');
        el('call-state').textContent = T.call_closed;
        el('call-dist').textContent = '';
        el('call-hint').hidden = true;
        hideTimer = setTimeout(() => { card.className = ''; }, 2600);
    }

    // ---- toast ----
    let toastTimer = null;
    function toast(text) {
        el('toast').textContent = text;
        el('toast').classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el('toast').classList.remove('show'), 3200);
    }

    // ---- /calls: list of open calls ----
    function showList(calls) {
        el('list-title').textContent = T.calls_title;
        el('list-close').textContent = T.calls_close;
        const rows = el('list-rows');
        rows.textContent = '';
        if (!calls.length) {
            const empty = document.createElement('li');
            empty.className = 'empty';
            empty.textContent = T.calls_none;
            rows.appendChild(empty);
        }
        calls.forEach((call) => {
            const li = document.createElement('li');
            const prio = document.createElement('span');
            prio.className = 'prio p' + (call.priority || 2);
            prio.textContent = 'P' + (call.priority || 2);
            const main = document.createElement('span');
            main.className = 'main';
            const title = document.createElement('span');
            title.className = 'title';
            title.textContent = call.title || T.default_call;
            const sub = document.createElement('span');
            sub.className = 'sub';
            sub.textContent = [call.code, `${call.units || 0} ${T.units_short}`, call.text].filter(Boolean).join(' · ');
            main.append(title, sub);
            const dist = document.createElement('span');
            dist.className = 'dist';
            dist.textContent = far(call.m || 0);
            li.append(prio, main, dist);

            if (call.mine || !call.take) {
                const note = document.createElement('span');
                note.className = 'note';
                note.textContent = call.mine ? T.calls_mine : T.calls_dispatch_only;
                li.appendChild(note);
            } else {
                const take = document.createElement('button');
                take.type = 'button';
                take.textContent = T.calls_take;
                take.addEventListener('click', () => { hideList(); post('takeCall', { id: call.id }); });
                li.appendChild(take);
            }
            rows.appendChild(li);
        });
        el('list').hidden = false;
    }

    function hideList() {
        if (el('list').hidden) return;
        el('list').hidden = true;
        post('closeCalls');
    }

    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideList(); });

    window.addEventListener('message', (e) => {
        const msg = e.data || {};
        try {
            if (msg.t && typeof msg.t === 'object') T = Object.assign({}, T, msg.t);
            if (msg.type === 'play') play(msg);
            else if (msg.type === 'call') showCall(msg.call || {});
            else if (msg.type === 'offer') showOffer(msg.call || {}, msg.m || 0);
            else if (msg.type === 'offerEnd') endOffer();
            else if (msg.type === 'browse') showBrowse(msg.call || {}, msg.index || 1, msg.total || 1);
            else if (msg.type === 'browseEnd') endBrowse();
            else if (msg.type === 'callUnits') { showSign(msg.callsign); showUnits(msg.info || {}); }
            else if (msg.type === 'callUpdate') updateCall(msg.call || {}, msg.moved);
            else if (msg.type === 'callDistance') showDistance(msg.m || 0, msg.scene);
            else if (msg.type === 'callClear') closeCall();
            else if (msg.type === 'toast') toast(String(msg.text || ''));
            else if (msg.type === 'list') showList(Array.isArray(msg.calls) ? msg.calls : []);
            else if (msg.type === 'listClose') { el('list').hidden = true; }
            else if (msg.type === 'capture') capture(!!msg.on);
        } catch (err) { /* a bad message must not break the page */ }
    });
})();
</script>
</body>
</html>
